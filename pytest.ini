[pytest]
testpaths = tests

# src/ est la racine des paquets : benchmark_generator, data_collection,
# utils, dataviz_tools s'importent en top-level, comme une fois installé.
pythonpath = src

addopts =
    --strict-markers
    -ra

markers =
    slow: test dont la durée dépasse quelques secondes (DuckDB par question)
