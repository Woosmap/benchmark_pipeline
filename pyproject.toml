[project]
name = "benchmark_pipeline"
version = "0.1.0"
description = "Generation de questions geospatiales a partir de donnees OpenStreetMap"
requires-python = ">=3.14"

# Librairies utilisees dans benchmark_pipeline/
dependencies = [
    "pandas",
    "numpy",
    "pyarrow",
    "duckdb>=1.0",       # requetes spatiales (extension spatial)
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj",
    "osmnx>=2.0",        # l'API a change en v2, ne pas descendre en dessous
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
viz = ["contextily"]
nlp = ["sentence-transformers"]

# Installation : uv sync (le groupe dev est installe par defaut)
[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ipykernel"
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

# Le paquet est a la racine, pas dans src/ : uv_build cherche par defaut
# src/<nom du projet>, il faut donc lui dire ou regarder.
[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # for `from tests.known_defects import ...`
addopts = ["--strict-markers", "-ra"]
markers = ["slow: slow tests (DuckDB per question)"]